<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Curso virtual: Gestión estratégica de experiencias y servicio en los procesos de atracción y selección de talento humano. Herramienta E-learning académica.">
  <meta name="color-scheme" content="light">
  <title>Experiencias y Servicio en Atracción y Selección · Curso E-learning</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#app">Ir al contenido</a>

  <header class="topbar">
    <button type="button" class="btn-icon menu-toggle" id="menu-toggle" data-action="toggle-menu" aria-label="Abrir menú de navegación" aria-expanded="false" aria-controls="sidebar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a class="brand" href="#/inicio">
      <img src="assets/logo.svg" alt="" width="36" height="36">
      <span class="brand-text">
        <span id="brand-title" class="brand-title">Curso E-learning</span>
        <span class="brand-sub">Atracción y Selección · Programa de 5 días</span>
      </span>
    </a>
    <div class="progress" role="progressbar" aria-label="Progreso del curso" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="progress-track"><div class="progress-bar" id="progress-bar"></div></div>
      <span class="progress-label" id="progress-label">0 %</span>
    </div>
    <a class="btn btn-ghost topbar-results" href="#/resultados">Resultados</a>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Contenido del curso">
      <div class="sidebar-head">
        <span>Contenido del curso</span>
        <button type="button" class="btn-icon" data-action="close-menu" aria-label="Cerrar menú">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <nav id="sidebar-nav" aria-label="Secciones"></nav>
    </aside>
    <div class="sidebar-backdrop" data-action="close-menu" aria-hidden="true"></div>

    <main id="app" class="main" tabindex="-1" aria-live="polite"></main>
  </div>

  <footer class="footer">
    <p id="footer-disclaimer"></p>
    <p class="small">Herramienta académica · HTML5, CSS3 y JavaScript · <span id="year"></span></p>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript>
    <div class="noscript">Este curso requiere JavaScript habilitado en el navegador para funcionar.</div>
  </noscript>

  <script src="js/content.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
